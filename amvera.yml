meta:
  environment: python
  toolchain:
    name: pip
    version: "3.12"
build:
  requirementsPath: requirements.txt
  useCache: true
run:
  command: venv/bin/python3 manage.py makemigrations && venv/bin/python3 manage.py migrate && gunicorn project.wsgi:application --bind 0.0.0.0:80
  containerPort: "80"
